{% extends 'base.html' %}
{% block title %}Get Recommendations{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h2 class="mb-3">Tell us about yourself</h2>
            <p class="text-muted">We'll use this to find the courses that best match you.</p>
            <form method="POST" novalidate>
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
                        {{ field.errors }}
                        {{ field }}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100">Get My Recommendations</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
